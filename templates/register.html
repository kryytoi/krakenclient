{% extends "base.html" %}
{% block title %}Регистрация — Kraken Client{% endblock %}
{% block content %}
<section class="auth-wrap">
  <form class="auth-card tilt-card" method="post">
    <span class="eyebrow">РЕГИСТРАЦИЯ</span>
    <h1>Создать аккаунт</h1>
    <label>Логин
      <input type="text" name="username" pattern="[a-zA-Z0-9_]{3,20}" required>
    </label>
    <label>Пароль
      <input type="password" name="password" minlength="6" required>
    </label>
    <label>Повторите пароль
      <input type="password" name="confirm" minlength="6" required>
    </label>
    <button class="btn btn-primary btn-block" type="submit">Зарегистрироваться</button>
    <p class="auth-switch">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
  </form>
</section>
{% endblock %}
